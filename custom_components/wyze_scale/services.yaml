add_user:
  name: Add user
  description: >-
    Create a new user profile on the scale. The scale must be awake
    (advertising). Returns the generated user_id; the user appears as a
    new sub-device after creation.
  fields:
    address:
      name: Scale address
      description: Bluetooth address of the scale (only needed with multiple scales).
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    sex:
      name: Sex
      description: Used by the scale's body-composition math.
      required: true
      selector:
        select:
          options:
            - "male"
            - "female"
    age:
      name: Age
      description: Age in years.
      required: true
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: years
    height_cm:
      name: Height
      description: Height in centimeters.
      required: true
      selector:
        number:
          min: 50
          max: 250
          unit_of_measurement: cm
    weight_kg:
      name: Approximate weight
      description: >-
        The person's approximate weight in kilograms - the scale uses it to
        match weigh-ins to users.
      required: true
      selector:
        number:
          min: 1
          max: 300
          step: 0.5
          unit_of_measurement: kg
    athlete_mode:
      name: Athlete mode
      description: Use the athlete body-composition model.
      required: false
      default: false
      selector:
        boolean:
    weight_only:
      name: Weight only
      description: Skip impedance/body-composition measurement for this user.
      required: false
      default: false
      selector:
        boolean:

delete_user:
  name: Delete user
  description: >-
    Delete a user profile from the scale and remove its sub-device. The
    scale must be awake (advertising).
  fields:
    address:
      name: Scale address
      description: Bluetooth address of the scale (only needed with multiple scales).
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    user_id:
      name: User ID
      description: >-
        The 32-hex-character user ID (shown as the user_id attribute on the
        user's Weight sensor).
      required: true
      selector:
        text:
